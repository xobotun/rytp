[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rytp"
version = "0.1.0"
description = "Download YouTube videos, transcribe with word-level timestamps, datamine, and splice."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "rytp" }]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "textual>=0.60",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Heavy / optional dependencies. Installed only by users who opt in.
yt-dlp = ["yt-dlp>=2024.5"]
stt = ["faster-whisper>=1.0"]
pyannote = [
    "pyannote-audio>=3.1",
    "torch>=2.1",
]
all = [
    "yt-dlp>=2024.5",
    "faster-whisper>=1.0",
    "pyannote-audio>=3.1",
    "torch>=2.1",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
rytp = "rytp.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["rytp*"]
exclude = ["tests*", "data*"]

[tool.setuptools.package-data]
rytp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true